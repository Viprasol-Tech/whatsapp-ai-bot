[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsapp-ai-bot"
version = "0.1.0"
description = "WhatsApp AI bot (FastAPI + WhatsApp Cloud API) routing messages to an LLM, with offline fakes — by Viprasol Tech."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = [
  "whatsapp",
  "whatsapp-bot",
  "whatsapp-ai-bot",
  "whatsapp-cloud-api",
  "ai",
  "llm",
  "chatbot",
  "fastapi",
  "conversational-ai",
  "webhook",
  "python",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Real WhatsApp Cloud API sending + running the server.
serve = ["httpx>=0.27", "uvicorn[standard]>=0.29"]
dev = [
  "httpx>=0.27",
  "uvicorn[standard]>=0.29",
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/whatsapp-ai-bot"
Issues = "https://github.com/Viprasol-Tech/whatsapp-ai-bot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_ai_bot"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy tokens in tests

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
